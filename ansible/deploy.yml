---
# Lot 3 : déploie legeni-webapp dans Kubernetes (staging ou prod).
# Usage (depuis le dossier ansible/) :
#   ansible-playbook deploy.yml -e target_env=staging -e app_version=1.0.0-1
#   ansible-playbook deploy.yml -e target_env=prod    -e app_version=1.0.0-1
# La version est toujours de la forme <VERSION>-<build> : jamais de tag "latest".
- name: Déploiement Kubernetes de legeni-webapp
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    app_image: noahboris/legeni-webapp

  pre_tasks:
    - name: Vérifier les paramètres
      ansible.builtin.assert:
        that:
          - target_env is defined
          - target_env in ['staging', 'prod']
          - app_version is defined
          - app_version is match('^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$')
        fail_msg: >-
          Usage : -e target_env=staging|prod -e app_version=<VERSION>-<build> (ex. 1.0.0-37).
          Le tag "latest" est refusé.
        quiet: true

    - name: Charger les variables de l'environnement et les secrets
      ansible.builtin.include_vars: "{{ item }}"
      loop:
        - "vars/{{ target_env }}.yml"
        - vars/vault.yml
      no_log: true

    - name: Vérifier le mot de passe Redis du coffre
      ansible.builtin.assert:
        that:
          - vault_redis_password is defined
          - vault_redis_password | length >= 12
        fail_msg: "vault_redis_password absent ou trop court (12 caractères minimum) dans vars/vault.yml"
        quiet: true
      no_log: true

    - name: Chercher un déploiement existant (pour savoir si un rollback est possible)
      kubernetes.core.k8s_info:
        kind: Deployment
        name: webapp
        namespace: "{{ k8s_namespace }}"
      register: previous_deploy

  tasks:
    - name: Créer le namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ k8s_namespace }}"
            labels: {env: "{{ app_env }}"}

    - name: Créer le secret Redis
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: redis-secret
            namespace: "{{ k8s_namespace }}"
          type: Opaque
          stringData:
            REDIS_PASSWORD: "{{ vault_redis_password }}"
      no_log: true

    - name: Déployer Redis (StatefulSet) et attendre qu'il soit prêt
      kubernetes.core.k8s:
        state: present
        template: k8s/redis.yml.j2
        wait: true
        wait_timeout: 180

    - name: Déployer l'application avec rollback automatique en cas d'échec
      block:
        - name: Appliquer les manifests et attendre la fin du rolling update
          kubernetes.core.k8s:
            state: present
            template: k8s/webapp.yml.j2
            wait: true
            wait_timeout: 180

        - name: Chercher un pod de la nouvelle version
          kubernetes.core.k8s_info:
            kind: Pod
            namespace: "{{ k8s_namespace }}"
            label_selectors: [app=webapp]
          register: webapp_pods
          until: >-
            webapp_pods.resources
            | selectattr('status.phase', 'equalto', 'Running')
            | rejectattr('metadata.deletionTimestamp', 'defined')
            | selectattr('spec.containers.0.image', 'equalto', app_image ~ ':' ~ app_version)
            | list | length > 0
          retries: 10
          delay: 3

        - name: Smoke test depuis le cluster (via le Service, version attendue)
          kubernetes.core.k8s_exec:
            namespace: "{{ k8s_namespace }}"
            pod: >-
              {{ (webapp_pods.resources
                  | selectattr('status.phase', 'equalto', 'Running')
                  | rejectattr('metadata.deletionTimestamp', 'defined')
                  | selectattr('spec.containers.0.image', 'equalto', app_image ~ ':' ~ app_version)
                  | first).metadata.name }}
            command: >-
              python -c "import json,urllib.request as u;
              u.urlopen('http://webapp/ready');
              d=json.load(u.urlopen('http://webapp/api/info'));
              assert d['version']=='{{ app_version }}', d; print(d)"
          register: smoke
          changed_when: false

        - name: Résultat
          ansible.builtin.debug:
            msg: "{{ app_env }} OK : {{ smoke.stdout | trim }}"

      rescue:
        - name: Retour à la version précédente
          kubernetes.core.k8s_rollback:
            api_version: apps/v1
            kind: Deployment
            name: webapp
            namespace: "{{ k8s_namespace }}"
          when: previous_deploy.resources | length > 0

        - name: Échouer explicitement (le pipeline doit passer au rouge)
          ansible.builtin.fail:
            msg: >-
              Déploiement de {{ app_version }} en {{ app_env }} échoué :
              {{ 'rollback effectué vers la version précédente' if previous_deploy.resources | length > 0
                 else 'premier déploiement, aucune version précédente vers laquelle revenir' }}
