---
- name: Créer le dossier d'installation de Jenkins
  ansible.builtin.file:
    path: "{{ jenkins_dir }}"
    state: directory
    mode: "0755"

- name: Copier les fichiers de l'image Jenkins
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ jenkins_dir }}/{{ item }}"
    mode: "0644"
  loop: [Dockerfile, plugins.txt, jenkins.yaml]
  register: jenkins_files

- name: Lire le GID du groupe docker
  ansible.builtin.getent:
    database: group
    key: docker

- name: Écrire le fichier compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jenkins_dir }}/docker-compose.yml"
    mode: "0644"

- name: Écrire le fichier .env (secrets, lisible par root seulement)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ jenkins_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  vars:
    docker_gid: "{{ getent_group['docker'][1] }}"
  no_log: true

- name: Construire l'image si les fichiers ont changé
  ansible.builtin.command: docker compose build
  args:
    chdir: "{{ jenkins_dir }}"
  when: jenkins_files is changed
  changed_when: true

- name: Démarrer Jenkins
  community.docker.docker_compose_v2:
    project_src: "{{ jenkins_dir }}"
    state: present
  no_log: true

- name: Attendre que Jenkins réponde
  ansible.builtin.uri:
    url: "http://localhost:{{ jenkins_port }}/login"
    status_code: 200
  register: jenkins_up
  until: jenkins_up.status == 200
  retries: 30
  delay: 10
  changed_when: false
